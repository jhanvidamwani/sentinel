<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Lato:wght@400;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#DEDCD7; --soft:#CFCCC5; --ink:#141414; --ink-2:#4A4844; --ink-3:#76736D; --line:#C4C0B8;
  --accent:#5B2BC4; --crit:#B3261E; --warn:#9A5B00; --ok:#23704A; --navy:#1C2394;
  --ev1:#1C2394; --ev2:#E8912D; --site:#4A4844; --land:#CBC7BE; --sea:#EAE8E3;
  --serif:"Newsreader","Iowan Old Style",Georgia,serif; --sans:"Lato","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{position:relative;min-height:100vh;color:var(--ink);font:15px/1.45 var(--sans);padding-inline:20px;padding-block:18px 36px;
  background:linear-gradient(180deg,#E9E7E2 0px,#DEDCD7 700px,#D5D2CB 100%);background-attachment:fixed}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

#isobars{position:absolute;top:0;left:0;width:100%;height:560px;z-index:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.5) 35%,transparent 80%),linear-gradient(to right,#000 0%,rgba(0,0,0,.2) 35%,rgba(0,0,0,.2) 62%,#000 100%);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.5) 35%,transparent 80%),linear-gradient(to right,#000 0%,rgba(0,0,0,.2) 35%,rgba(0,0,0,.2) 62%,#000 100%);mask-composite:intersect}

header{display:flex;align-items:center;gap:16px;padding-bottom:16px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ink);transform-origin:left}
.wm{font-weight:700;letter-spacing:.32em;font-size:17px}
.div{width:1px;height:24px;background:var(--line)}
.tl{font-family:var(--serif);font-size:18px;color:var(--ink-2)}
.stamp{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.replay{background:var(--ink);color:#F1EFEA;border:0;padding:10px 22px;font-weight:700}
.replay:hover{background:var(--navy)}
@media (max-width:760px){.stamp,.tl,.div{display:none}.replay{margin-left:auto}}

.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:end}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h2{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.hero h2 em{color:var(--accent);font-style:italic;background-image:linear-gradient(currentColor,currentColor);background-size:100% 1px;background-position:0 92%;background-repeat:no-repeat;transition:background-size 1.1s ease .9s}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.kpi span{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--ink-3)}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.1}

.strip{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding-top:14px}
.strip::before{content:"";position:absolute;left:0;right:0;top:20px;height:1px;background:var(--line)}
.strip button{all:unset;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:4px;padding-top:18px}
.strip button:focus-visible{outline:2px solid var(--accent)}
.strip .dot{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ink-3)}
.strip .on .dot{background:var(--c);border-color:var(--c)}
.strip .src{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.strip .t{font-size:13.5px;line-height:1.3}
.strip .off{opacity:.45}
@media (max-width:860px){.strip{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}.strip::before{display:none}}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
.evt th{font-size:12px;color:var(--ink-3);font-weight:400;text-align:left;padding:0 12px 8px 0;border-bottom:1px solid var(--ink)}
.evt td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.evt tbody td:first-child{border-left:4px solid var(--c);padding-left:12px;width:56px}
.evt .pn{font-family:var(--serif);font-size:26px}
.evt b{font-family:var(--serif);font-weight:500;font-size:20px}
.evt .where{color:var(--ink-2);font-size:13.5px;margin-left:8px}
.evt .r{text-align:right;font-family:var(--serif);font-size:20px}
.evt th.r{font-family:var(--sans);font-size:12px}
.evt tr.idle{opacity:.55}

.g3{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.8fr);gap:40px;align-items:start}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:980px){.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.sec{border-top:1px solid var(--ink);padding-top:14px;min-width:0}
.sec h3{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:14px}
.muted{color:var(--ink-3)}

.legend{display:flex;gap:16px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.legend i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:9px}
.b{display:grid;grid-template-columns:108px minmax(0,1fr) 58px;gap:10px;align-items:center;font-size:13.5px}
.b .t{height:12px;display:flex;gap:2px;background:var(--soft)}
.b .t i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.b .v{text-align:right}

.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo li:first-child{padding-top:0}
.todo input{width:16px;height:16px;margin-top:4px;accent-color:var(--ink)}
.todo label{cursor:pointer}
.todo b{display:block;font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.25}
.todo .ev{font-size:12.5px;color:var(--ink-2);padding-left:7px;border-left:3px solid var(--c)}
.todo .when{font-size:12.5px;font-weight:700;text-align:right;white-space:nowrap}
.todo .when.hi{color:var(--crit)}.todo .when.md{color:var(--warn)}
.todo li.done b{text-decoration:line-through;color:var(--ink-3)}

.globe{display:flex;flex-direction:column;align-items:center;gap:8px}
.globe canvas{width:100%;max-width:260px;aspect-ratio:1;height:auto;display:block}
.globe p{font-size:12.5px;color:var(--ink-2);text-align:center}

.subs{display:flex;flex-direction:column}
.sub{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 120px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sub:first-child{padding-top:0}
.sub b{display:block;font-family:var(--serif);font-weight:500;font-size:18px}
.sub .req{font-size:12.5px;color:var(--ink-3)}
.sub .v{font-family:var(--serif);font-size:17px;padding-left:9px;border-left:3px solid currentColor}
.sub .v.no{color:var(--crit)}.sub .v.chg{color:var(--warn)}.sub .v.yes{color:var(--ok)}
.sub .why{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.cap{height:8px;background:var(--soft);display:flex}
.cap i{display:block;height:100%;background:var(--ink-3);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.cap i.add{background:currentColor}
.capt{font-size:12px;color:var(--ink-3);margin-top:4px}
@media (max-width:640px){.sub{grid-template-columns:minmax(0,1fr)}}

.after{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.after h4{font-size:12.5px;font-weight:700;color:var(--ink-2);padding-left:7px;border-left:3px solid var(--c);margin-bottom:8px}
.after ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--serif);font-size:16.5px}

.impact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
@media (max-width:760px){.impact{grid-template-columns:minmax(0,1fr)}}
.impact h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.impact p{font-size:14px;padding-left:9px;border-left:3px solid var(--c);margin-bottom:8px}
footer{font-size:12px;color:var(--ink-3)}

.note{font-size:15px;color:var(--ink-2);margin-top:12px;max-width:60ch}
.evt .lines{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.evt .op{font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.todo .when small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3)}
.todo .when.lo{color:var(--navy)}
.sub .meta{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.sub .flags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px}
.sub .flags em{font-style:normal;font-size:12px;color:var(--ink-2)}
.sub .flags em.pass{color:var(--ok)}.sub .flags em.watch{color:var(--warn)}.sub .flags em.fail{color:var(--crit)}
.after li span{display:block;font-family:var(--sans);font-size:12.5px;color:var(--ink-3)}
.impact p b{display:block;font-weight:700;font-size:14px}
.impact p span{display:block;font-size:13px;color:var(--ink-2)}
.wrap>*{transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.boot .wrap>*:not(header){opacity:0;transform:translateY(14px)}
.boot header::after{transform:scaleX(0)}
.opening header::after{transition:transform 1s cubic-bezier(.65,0,.35,1)}
.boot .b .t i,.boot .cap i{width:0!important}
.boot .hero h2 em{background-size:0 1px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.boot .wrap>*{opacity:1!important;transform:none!important}.boot header::after{transform:none}}
</style>
</head>
<body class="boot">
<canvas id="isobars" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <h1 class="wm">SENTINEL</h1><span class="div" aria-hidden="true"></span><span class="tl">Cat desk</span>
    <p class="stamp" id="stamp"></p>
    <button class="replay" id="replay">Replay</button>
  </header>

  <section class="hero" aria-live="polite">
    <div><h2 id="headline"></h2><p class="note" id="note"></p></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <nav class="strip" id="strip" aria-label="Signals, click to rewind"></nav>

  <section class="tbl" id="events"></section>

  <div class="g3">
    <section class="sec"><h3>Exposed book</h3><div id="bars"></div></section>
    <section class="sec"><h3>Do now</h3><ul class="todo" id="todo"></ul></section>
    <section class="sec globe"><h3 style="align-self:flex-start">Where</h3><canvas id="globe" width="260" height="260" role="img" aria-label="Globe with active events"></canvas><p id="globecap"></p></section>
  </div>

  <div class="g2">
    <section class="sec"><h3>Submissions today</h3><div class="subs" id="subs"></div></section>
    <section class="sec"><h3>Change at renewal</h3><div class="after" id="after"></div></section>
  </div>

  <section class="sec"><div class="impact" id="impact"></div></section>

  <footer>Replay of real 2024 event timelines. Portfolio, clients and terms are illustrative.</footer>
</div>

<script>

function exposure(e){return ASSETS.map(a=>{const d=km(e.lat,e.lon,a.lat,a.lon);return {...a,d,decay:(1-d/radius(e))**2};}).filter(a=>a.d<=radius(e));}
function loss(h,sc,e){const sev=e.kind==="hurricane"?Math.min(5,Math.max(0,(Math.max(...e.signals.filter(x=>x.kind===e.kind).map(x=>x.intensity))-50)/20)):Math.min(5,Math.max(0,(Math.max(...e.signals.filter(x=>x.kind===e.kind).map(x=>x.intensity))-5.5)*2));
  const b=Math.round(sev);return [0,1,2].map(i=>h.reduce((t,x)=>t+(x.tiv*DR[b][i]+x.rev*BI[b][i])*x.decay,0));}

const $=id=>document.getElementById(id);
const money=m=>m>=1000?"$"+(m/1000).toFixed(1)+"B":"$"+Math.round(m)+"M";
const when=t=>new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});
let shown=ALL.length,timer=null,lastR=[];const DONE=new Set();

function analyse(){
  const seen=ALL.slice(0,shown);
  return Object.entries(EV).map(([k,E])=>{
    const ev=detect(seen.filter(s=>s.ev===k)); if(!ev) return {k,E,ev:null};
    const hits=exposure(ev),sc=score(ev,hits),L=loss(hits,sc,ev);
    return {k,E,ev,hits,sc,L,book:Object.values(E.book).reduce((a,b)=>a+b,0)};
  }).sort((a,b)=>(b.sc?b.sc.total:-1)-(a.sc?a.sc.total:-1));
}

function render(){
  const R=analyse(),act=R.filter(r=>r.ev); lastR=R;
  const totLoss=act.reduce((t,r)=>t+r.L[1],0),totBook=act.reduce((t,r)=>t+r.book,0);
  $("headline").innerHTML=act.length?`Focus first on <em>the ${act[0].E.name}.</em>`:`Watching. <em>Nothing confirmed yet.</em>`;
  $("note").textContent=act.length>1?"Hualien is one concentrated tech loss with a long supply-chain tail. Beryl is smaller but touches seven lines, and its client calls have the shortest window.":act.length?"One event open. Everything below is sorted for it.":"Sentinel is watching public feeds. News alone never opens an event.";
  $("kpis").innerHTML=`<div class="kpi"><span>Events</span><b>${act.length}</b></div><div class="kpi"><span>Est. loss</span><b>${act.length?money(totLoss):"None"}</b></div><div class="kpi"><span>Book exposed</span><b>${act.length?money(totBook):"None"}</b></div>`;
  $("strip").innerHTML=ALL.map((s,i)=>`<button data-i="${i}" class="${i<shown?"on":"off"}" style="--c:${EV[s.ev].color}" aria-label="Rewind to ${s.title}"><span class="dot"></span><span class="src">${s.source} · ${when(s.time)}</span><span class="t">${s.title}</span></button>`).join("");
  $("events").innerHTML=`<table class="evt"><thead><tr><th></th><th>Event</th><th>Opened</th><th class="r">Score</th><th class="r">Est. loss</th><th class="r">Book</th><th class="r">Confidence</th><th class="r">Share of 1 in 100 loss</th></tr></thead><tbody>${
    R.map((r,i)=>r.ev?`<tr style="--c:${r.E.color}"><td><span class="pn">${i+1}</span></td><td><b>${r.E.name}</b><span class="where">${r.E.place}</span><span class="lines">${r.E.lines}</span></td><td class="op">${when(r.ev.signals.filter(x=>x.kind!=="news").map(x=>x.time).sort()[0])}</td><td class="r">${r.sc.total.toFixed(1)}</td><td class="r">${money(r.L[1])}</td><td class="r">${money(r.book)}</td><td class="r">${Math.round(r.sc.conf*100)}%</td><td class="r">${(r.L[1]/r.E.pml*100).toFixed(1)}%</td></tr>`
    :`<tr class="idle" style="--c:var(--line)"><td><span class="pn"></span></td><td><b>${r.E.name}</b><span class="where">not confirmed yet</span></td><td colspan="6"></td></tr>`).join("")}</tbody></table>`;
  if(act.length){
    const lines={};act.forEach(r=>Object.entries(r.E.book).forEach(([n,v])=>{(lines[n]=lines[n]||{})[r.k]=v;}));
    const rows=Object.entries(lines).map(([n,p])=>[n,p,Object.values(p).reduce((a,b)=>a+b,0)]).sort((a,b)=>b[2]-a[2]);
    const max=rows[0][2];
    $("bars").innerHTML=`<div class="legend">${act.map(r=>`<span><i style="background:${r.E.color}"></i>${r.E.short}</span>`).join("")}</div><div class="bars">${
      rows.map(([n,p,t])=>`<div class="b"><span>${n}</span><div class="t">${act.map(r=>p[r.k]?`<i title="${r.E.short}: ${money(p[r.k])}" style="width:${(p[r.k]/max*100).toFixed(1)}%;background:${r.E.color}"></i>`:"").join("")}</div><span class="v num">${money(t)}</span></div>`).join("")}</div>`;
  } else $("bars").innerHTML=`<p class="muted">Nothing exposed yet.</p>`;
  const items=[];act.forEach(r=>{const pause=r.sc.tier!=="WATCH";r.E.todo.forEach(([t,risk,h,w,who],j)=>items.push({r,id:r.k+j,t:j===0&&!pause?"Draft a binding pause":t,risk:j===0&&!pause?2:risk,h,w,who}));});
  items.sort((x,y)=>y.risk-x.risk||x.h-y.h||y.r.sc.total-x.r.sc.total);
  $("todo").innerHTML=items.length?items.map(it=>`<li class="${DONE.has(it.id)?"done":""}"><input type="checkbox" id="c${it.id}" data-id="${it.id}" ${DONE.has(it.id)?"checked":""}><label for="c${it.id}"><b>${it.t}</b><span class="ev" style="--c:${it.r.E.color}">${it.r.E.short} · ${it.who}</span></label><span class="when ${it.risk===3?"hi":it.risk===2?"md":"lo"}">${it.w}<small>${["","Low","Medium","High"][it.risk]}</small></span></li>`).join(""):`<li class="muted" style="display:block;border:0">Nothing to do yet.</li>`;
  $("subs").innerHTML=CLIENTS.map(c=>{
    const hit=act.find(r=>km(r.ev.lat,r.ev.lon,c.lat,c.lon)<=radius(r.ev));
    const dep=c.supplier&&act.find(r=>r.hits.some(h=>h.short===c.supplier));
    const [used,add,cap]=c.zone,pct=(used+add)/cap*100;
    let v,cls,why;
    if(hit&&hit.sc.tier!=="WATCH"){v="Decline for now";cls="no";why=`In ${hit.E.short}'s path, binding paused`;}
    else if(hit){v="Accept with changes";cls="chg";why=`Near ${hit.E.short}, add storm deductible`;}
    else if(dep){v="Accept with changes";cls="chg";why="Chip supplier hit, add sublimit";}
    else {v="Accept";cls="yes";why="Clear of every event";}
    return `<div class="sub"><div><b>${c.name}</b><span class="req">${c.req}</span><span class="meta">${c.rel} · ${c.prem}</span><span class="flags">${[...(hit?[["fail","In event path"]]:dep?[["watch","Supplier hit"]]:[["pass","Clear of events"]]),...c.flags].map(([k,t])=>`<em class="${k}">${{pass:"✓",watch:"!",fail:"✕"}[k]} ${t}</em>`).join("")}</span></div><div><span class="v ${cls}">${v}</span><span class="why">${why}</span></div>
      <div class="${cls==="no"?"no":pct>=80?"chg":"yes"}" style="color:var(--${pct>=95?"crit":pct>=80?"warn":"ok"})"><div class="cap"><i style="width:${(used/cap*100).toFixed(1)}%"></i><i class="add" style="width:${(add/cap*100).toFixed(1)}%"></i></div><p class="capt">${pct.toFixed(0)}% of zone limit</p></div></div>`;}).join("");
  $("after").innerHTML=act.length?act.map(r=>`<div><h4 style="--c:${r.E.color}">${r.E.short}</h4><ul>${r.E.after.map(([a,w])=>`<li>${a}<span>${w}</span></li>`).join("")}</ul></div>`).join(""):`<p class="muted">Nothing yet.</p>`;
  $("impact").innerHTML=act.length?[["Health",r=>r.E.health],["Markets",r=>r.E.markets],["Claims",r=>[`${money(r.L[0])} to ${money(r.L[2])}`,r.E.lines]]].map(([h,f])=>`<div><h4>${h}</h4>${act.map(r=>{const [a,b]=f(r);return `<p style="--c:${r.E.color}"><b>${a}</b><span>${b}</span></p>`;}).join("")}</div>`).join(""):`<p class="muted">No impact yet.</p>`;
  $("replay").textContent=timer?"Stop":"Replay";
}

$("replay").onclick=()=>{
  if(timer){clearInterval(timer);timer=null;render();return;}
  shown=0;timer=setInterval(()=>{shown++;if(shown>=ALL.length){clearInterval(timer);timer=null;}render();},1400);render();
};
$("strip").onclick=e=>{const b=e.target.closest("button");if(!b)return;clearInterval(timer);timer=null;shown=+b.dataset.i+1;render();};
$("todo").addEventListener("change",e=>{const id=e.target.dataset.id;if(!id)return;e.target.checked?DONE.add(id):DONE.delete(id);render();});
$("stamp").textContent=new Date().toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"})+" · replaying 2024 events";
render();
(function(){
  const cv=$("isobars"),cx=cv.getContext("2d"),reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,D,start=performance.now();
  const lows=[{x:.06,y:.12,k:.9,ph:.4},{x:.94,y:.3,k:.8,ph:2.1}];
  function size(){D=Math.min(2,devicePixelRatio||1);W=document.documentElement.clientWidth;H=560;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0);}
  function draw(now){
    const t=reduce?1:Math.min(1,(now-start)/1800),e=1-Math.pow(1-t,3);
    cx.clearRect(0,0,W,H);cx.strokeStyle="#141414";cx.lineWidth=1;
    lows.forEach(l=>{const ox=l.x*W,oy=l.y*H,max=Math.hypot(W,H)*.55*l.k;
      for(let r=28,i=0;r<max;r+=34,i++){const rr=r*e;if(rr<4)continue;
        cx.globalAlpha=Math.max(0,.085-i*.004)*(i%5===0?1.6:1);cx.beginPath();
        for(let a=0;a<=Math.PI*2+.01;a+=Math.PI/90){const w=1+.07*Math.sin(3*a+l.ph+i*.25)+.04*Math.sin(5*a-l.ph*1.3)+.02*Math.sin(9*a+i);
          const x=ox+Math.cos(a)*rr*w*1.25,y=oy+Math.sin(a)*rr*w;a?cx.lineTo(x,y):cx.moveTo(x,y);}
        cx.stroke();}});
    cx.globalAlpha=1;if(t<1)requestAnimationFrame(draw);}
  size();requestAnimationFrame(draw);addEventListener("resize",()=>{size();draw(performance.now()+1e5);});
})();
(function(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,kids=[...document.querySelectorAll(".wrap>*")];
  kids.forEach((el,i)=>el.style.transitionDelay=(i*90+250)+"ms");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{document.body.classList.add("opening");document.body.classList.remove("boot");
    setTimeout(()=>{kids.forEach(el=>el.style.transitionDelay="");document.body.classList.remove("opening");},2200);}));
  if(reduce)return;
  document.querySelectorAll(".kpi b").forEach(el=>{const m=el.textContent.match(/^\$([\d.]+)([MB])$/);if(!m)return;
    const target=+m[1],unit=m[2],dec=unit==="B"?1:0,t0=performance.now()+450;
    const step=now=>{const k=Math.min(1,Math.max(0,(now-t0)/1200)),v=target*(1-Math.pow(1-k,3));el.textContent="$"+v.toFixed(dec)+unit;if(k<1)requestAnimationFrame(step);};
    el.textContent="$0"+unit;requestAnimationFrame(step);});
})();
(function(){
  const LAND=topojson.feature(TOPO,TOPO.objects.land),GRAT=d3.geoGraticule10();
  const cv=$("globe"),ctx=cv.getContext("2d"),D=Math.min(2,devicePixelRatio||1),SZ=260;
  cv.width=SZ*D;cv.height=SZ*D;ctx.scale(D,D);
  const proj=d3.geoOrthographic().scale(SZ/2-4).translate([SZ/2,SZ/2]).clipAngle(90).precision(.5),path=d3.geoPath(proj,ctx);
  const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim(),still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let spin=-40;
  function draw(){
    const act=lastR.filter(r=>r.ev);if(still&&act[0])spin=-act[0].ev.lon;
    proj.rotate([spin,-15]);ctx.clearRect(0,0,SZ,SZ);
    ctx.beginPath();path({type:"Sphere"});ctx.fillStyle=css("--sea");ctx.fill();
    ctx.beginPath();path(GRAT);ctx.strokeStyle=css("--line");ctx.lineWidth=.6;ctx.stroke();
    ctx.beginPath();path(LAND);ctx.fillStyle=css("--land");ctx.fill();
    const centre=proj.invert([SZ/2,SZ/2]);
    act.forEach((r,i)=>{const col=css(r.k==="beryl"?"--ev1":"--ev2");
      ctx.beginPath();path(d3.geoCircle().center([r.ev.lon,r.ev.lat]).radius(radius(r.ev)/111.2*2.4)());ctx.globalAlpha=.3;ctx.fillStyle=col;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=col;ctx.lineWidth=1.4;ctx.stroke();
      if(d3.geoDistance([r.ev.lon,r.ev.lat],centre)<Math.PI/2){const [x,y]=proj([r.ev.lon,r.ev.lat]);
        ctx.beginPath();ctx.arc(x,y,4,0,2*Math.PI);ctx.fillStyle=col;ctx.fill();
        ctx.font="700 12px Lato, Arial, sans-serif";ctx.fillStyle=css("--ink");ctx.fillText(`${i+1} ${r.E.short}`,x+7,y-6);}});
    ctx.beginPath();path({type:"Sphere"});ctx.strokeStyle=css("--line");ctx.lineWidth=1;ctx.stroke();
    $("globecap").textContent=act.length?act.map((r,i)=>`${i+1}. ${r.E.name}`).join("   "):"No active events";
  }
  (function tick(){if(!still)spin+=.25;draw();requestAnimationFrame(tick);})();
})();
</script>
</body>
